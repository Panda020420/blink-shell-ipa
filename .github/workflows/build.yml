name: CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # 使用 macOS 14 运行器

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          # 自动寻找以 Xcode_16 开头的目录路径
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | head -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "未找到 Xcode 16，使用系统默认 Xcode"
            xcodebuild -version
          else
            echo "找到 Xcode 路径: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            xcodebuild -version
          fi

      - name: use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_resources.sh

      - name: copy xcconfig
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Blink.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Generate Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Blink.xcarchive/Products/Applications/Blink.app build/Payload/
          cd build
          zip -r Blink_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlinkShell-Unsigned-IPA
          path: build/Blink_Unsigned.ipa
          retention-days: 7
